[project]
name = "keithley2000-hp34401A-dmm-gui"
dynamic = ["version"]
description = "Python KEITHLEY 2000 - HP 34401A DMM GUI"
authors = [
    { name = "Lorenzo Mariani", email = "newmarioman@hotmail.it" },
]

license = "MIT"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B019", "B905"]
